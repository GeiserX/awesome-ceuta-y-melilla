<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="256" height="256" role="img" aria-label="Awesome Ceuta y Melilla">
  <!-- The favicon: the same Faro de Melilla as logo.svg, on a plate in the
       banner's darkest sky stop (#0a0a0f), with the banner's lantern glow
       colour (#ffd98a) behind the lantern. Ids carry an aw- prefix. -->
  <defs>
    <radialGradient id="aw-icon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffd98a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="360" rx="72" fill="#0a0a0f"/>
  <g transform="translate(-2252 -53.6) scale(3.2)">
    <circle cx="760" cy="52" r="16" fill="url(#aw-icon-glow)"/>
    <polygon points="752,110 768,110 765,62 755,62" fill="#ece6d8"/>
    <polygon points="760,110 768,110 765,62 760,62" fill="#c9c1ae"/>
    <rect x="751" y="58" width="18" height="4" fill="#d8d0bd"/>
    <rect x="754" y="47" width="12" height="11" fill="#ffe3a0"/>
    <g stroke="#3a3228" stroke-width="0.8"><line x1="758" y1="47" x2="758" y2="58"/><line x1="762" y1="47" x2="762" y2="58"/></g>
    <path d="M752,47 Q760,38 768,47 Z" fill="#6a5a48"/>
    <rect x="759.3" y="36" width="1.4" height="5" fill="#6a5a48"/>
    <rect x="757" y="76" width="6" height="7" rx="3" fill="#6a5a48" opacity="0.7"/>
  </g>
</svg>
