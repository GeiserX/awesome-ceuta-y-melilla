<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="a-clip"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="a-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="70%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#2a1f1c"/>
    </linearGradient>
    <linearGradient id="a-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17404a"/>
      <stop offset="100%" stop-color="#0a1e25"/>
    </linearGradient>
    <linearGradient id="a-stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c7a26c"/>
      <stop offset="100%" stop-color="#8a6a42"/>
    </linearGradient>
    <linearGradient id="a-stone-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9c7a4c"/>
      <stop offset="100%" stop-color="#65492b"/>
    </linearGradient>
    <linearGradient id="a-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6e5a44"/>
      <stop offset="100%" stop-color="#3a2f25"/>
    </linearGradient>
    <linearGradient id="a-beam-l" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </linearGradient>
    <filter id="a-blur-lg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="a-blur-sm" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g clip-path="url(#a-clip)">
    <rect width="800" height="200" fill="url(#a-sky)"/>
    <ellipse cx="400" cy="190" rx="360" ry="60" fill="#c9804a" opacity="0.10" filter="url(#a-blur-lg)"/>
    <ellipse cx="730" cy="80" rx="120" ry="80" fill="#ffd98a" opacity="0.06" filter="url(#a-blur-lg)"/>

    <!-- night sky -->
    <g fill="#f3e6c8">
      <circle cx="48" cy="28" r="0.9" opacity="0.6"/><circle cx="112" cy="54" r="0.7" opacity="0.45"/>
      <circle cx="176" cy="22" r="0.8" opacity="0.5"/><circle cx="92" cy="86" r="0.6" opacity="0.35"/>
      <circle cx="610" cy="18" r="0.8" opacity="0.5"/><circle cx="690" cy="40" r="0.6" opacity="0.4"/>
      <circle cx="790" cy="22" r="0.7" opacity="0.45"/><circle cx="520" cy="130" r="0.6" opacity="0.3"/>
      <circle cx="290" cy="136" r="0.6" opacity="0.3"/><circle cx="36" cy="72" r="0.6" opacity="0.35"/>
    </g>

    <!-- sea -->
    <rect x="0" y="171.5" width="800" height="1" fill="#6fa6ad" opacity="0.25"/>
    <rect x="0" y="172" width="800" height="28" fill="url(#a-sea)"/>
    <g fill="none" stroke="#6fa6ad" stroke-linecap="round" opacity="0.35">
      <path d="M250,180 q8,-3 16,0 t16,0" stroke-width="1"/>
      <path d="M330,186 q8,-3 16,0 t16,0 t16,0" stroke-width="1"/>
      <path d="M430,179 q8,-3 16,0 t16,0" stroke-width="1"/>
      <path d="M500,189 q8,-3 16,0 t16,0 t16,0" stroke-width="1"/>
      <path d="M380,194 q8,-3 16,0 t16,0" stroke-width="0.8"/>
    </g>

    <!-- Ceuta: Murallas Reales and the Foso de San Felipe -->
    <g>
      <!-- reflection in the moat -->
      <g opacity="0.12" transform="translate(0,344) scale(1,-1)">
        <polygon points="0,112 146,112 156,172 0,172" fill="#c7a26c"/>
        <polygon points="150,126 208,126 222,172 156,172" fill="#c7a26c"/>
      </g>
      <!-- main curtain with sloped scarp -->
      <polygon points="0,112 146,112 156,172 0,172" fill="url(#a-stone)"/>
      <rect x="0" y="112" width="146" height="5" fill="#d9b985"/>
      <polygon points="146,112 150,112 160,172 156,172" fill="#6d5030"/>
      <!-- lower bastion -->
      <polygon points="150,126 208,126 222,172 156,172" fill="url(#a-stone-side)"/>
      <rect x="150" y="126" width="58" height="4" fill="#b8955f"/>
      <!-- ashlar courses -->
      <g stroke="#6d5030" stroke-width="0.6" opacity="0.45">
        <line x1="0" y1="128" x2="148" y2="128"/>
        <line x1="0" y1="142" x2="150" y2="142"/>
        <line x1="0" y1="156" x2="153" y2="156"/>
        <line x1="154" y1="142" x2="212" y2="142"/>
        <line x1="156" y1="156" x2="216" y2="156"/>
      </g>
      <!-- cordon moulding -->
      <rect x="0" y="120" width="147" height="1.6" fill="#e6c996" opacity="0.7"/>
      <!-- embrasures -->
      <g fill="#3b2a18">
        <rect x="22" y="112" width="7" height="4"/>
        <rect x="58" y="112" width="7" height="4"/>
        <rect x="94" y="112" width="7" height="4"/>
      </g>
      <!-- gate arch -->
      <path d="M64,172 L64,150 A10,10 0 0 1 84,150 L84,172 Z" fill="#241910"/>
      <path d="M61,172 L61,150 A13,13 0 0 1 87,150 L87,172" fill="none" stroke="#e6c996" stroke-width="1.4" opacity="0.6"/>
      <!-- garita on the salient of the curtain -->
      <g transform="translate(140,112)">
        <path d="M-7,0 L7,0 L0,11 Z" fill="#8a6a42"/>
        <rect x="-7" y="-15" width="14" height="15" fill="#d6b27c"/>
        <path d="M-8.5,-15 Q0,-30 8.5,-15 Z" fill="#c7a26c"/>
        <circle cx="0" cy="-26" r="1.6" fill="#e6c996"/>
        <rect x="-1.5" y="-11" width="3" height="7" rx="1.5" fill="#241910"/>
        <rect x="-8.5" y="-16" width="17" height="2" fill="#e6c996"/>
      </g>
      <!-- garita on the bastion -->
      <g transform="translate(205,126)">
        <path d="M-6,0 L6,0 L0,9 Z" fill="#65492b"/>
        <rect x="-6" y="-12" width="12" height="12" fill="#b8955f"/>
        <path d="M-7.5,-12 Q0,-25 7.5,-12 Z" fill="#a8864f"/>
        <rect x="-1.2" y="-9" width="2.4" height="6" rx="1.2" fill="#241910"/>
        <rect x="-7.5" y="-13" width="15" height="1.8" fill="#d6b27c"/>
      </g>
    </g>

    <!-- Melilla la Vieja on its headland, with the Faro de Melilla -->
    <g>
      <!-- lighthouse beam -->
      <polygon points="758,50 640,28 640,76" fill="url(#a-beam-l)" opacity="0.7"/>
      <!-- walls of the first enclosure, stepped up the rock -->
      <polygon points="624,124 690,124 690,150 624,150" fill="url(#a-stone)"/>
      <polygon points="690,110 800,110 800,150 690,150" fill="url(#a-stone)"/>
      <rect x="624" y="124" width="66" height="3" fill="#d9b985"/>
      <rect x="690" y="110" width="110" height="3" fill="#d9b985"/>
      <rect x="688" y="110" width="3" height="40" fill="#8a6a42"/>
      <g fill="#3b2a18">
        <rect x="636" y="124" width="6" height="3.5"/>
        <rect x="662" y="124" width="6" height="3.5"/>
        <rect x="738" y="110" width="6" height="3.5"/>
        <rect x="784" y="110" width="6" height="3.5"/>
      </g>
      <g stroke="#6d5030" stroke-width="0.6" opacity="0.45">
        <line x1="624" y1="136" x2="690" y2="136"/>
        <line x1="690" y1="124" x2="800" y2="124"/>
        <line x1="690" y1="138" x2="800" y2="138"/>
      </g>
      <!-- garita on the corner of the lower wall -->
      <g transform="translate(628,124)">
        <path d="M-6,0 L6,0 L0,9 Z" fill="#8a6a42"/>
        <rect x="-6" y="-12" width="12" height="12" fill="#d6b27c"/>
        <path d="M-7.5,-12 Q0,-25 7.5,-12 Z" fill="#c7a26c"/>
        <rect x="-1.2" y="-9" width="2.4" height="6" rx="1.2" fill="#241910"/>
        <rect x="-7.5" y="-13" width="15" height="1.8" fill="#e6c996"/>
      </g>
      <!-- reflection -->
      <g opacity="0.12" transform="translate(0,344) scale(1,-1)">
        <path d="M560,172 C585,166 600,152 626,146 L800,138 L800,172 Z" fill="#6e5a44"/>
      </g>
      <!-- rock headland -->
      <path d="M556,172 C580,168 596,158 612,150 C626,144 650,144 690,142 C720,140 760,138 800,136 L800,172 Z" fill="url(#a-rock)"/>
      <g stroke="#241c15" stroke-width="0.9" fill="none" opacity="0.5" stroke-linecap="round">
        <path d="M572,168 C590,163 604,157 618,152"/>
        <path d="M600,166 C620,160 640,156 662,153"/>
        <path d="M646,164 C672,160 700,156 730,152"/>
        <path d="M708,166 C740,161 770,156 800,152"/>
        <path d="M760,164 C775,161 788,159 800,158"/>
      </g>
      <!-- church bell tower -->
      <g>
        <rect x="700" y="84" width="14" height="26" fill="#dccaa6"/>
        <rect x="703.5" y="89" width="7" height="10" rx="3.5" fill="#3b2a18"/>
        <rect x="705" y="91" width="4" height="6" rx="2" fill="#ffe3a0" opacity="0.85"/>
        <rect x="698" y="82" width="18" height="3" fill="#efe2c4"/>
        <polygon points="699,82 707,64 715,82" fill="#8a6a42"/>
        <polygon points="707,64 715,82 711,82" fill="#65492b"/>
        <rect x="706.4" y="58" width="1.2" height="7" fill="#efe2c4"/>
      </g>
      <!-- house fronts inside the walls -->
      <g fill="#e9dfc9" opacity="0.9">
        <rect x="722" y="98" width="16" height="12"/>
        <rect x="776" y="94" width="22" height="16"/>
      </g>
      <g fill="#f6efdc">
        <rect x="721" y="97" width="18" height="1.5"/>
        <rect x="775" y="93" width="24" height="1.5"/>
      </g>
      <g fill="#ffe3a0" opacity="0.9">
        <rect x="726" y="101" width="2.6" height="3.4" rx="0.4"/>
        <rect x="732" y="101" width="2.6" height="3.4" rx="0.4"/>
        <rect x="780" y="97" width="2.6" height="3.4" rx="0.4"/>
        <rect x="786" y="97" width="2.6" height="3.4" rx="0.4"/>
        <rect x="792" y="97" width="2.6" height="3.4" rx="0.4"/>
      </g>
      <g fill="#3b2a18" opacity="0.85">
        <rect x="785" y="104" width="4" height="6" rx="2"/>
      </g>
      <!-- lighthouse -->
      <g>
        <circle cx="760" cy="52" r="10" fill="#ffd98a" opacity="0.55" filter="url(#a-blur-sm)"/>
        <polygon points="752,110 768,110 765,62 755,62" fill="#ece6d8"/>
        <polygon points="760,110 768,110 765,62 760,62" fill="#c9c1ae"/>
        <rect x="751" y="58" width="18" height="4" fill="#d8d0bd"/>
        <rect x="754" y="47" width="12" height="11" fill="#ffe3a0"/>
        <g stroke="#3a3228" stroke-width="0.8"><line x1="758" y1="47" x2="758" y2="58"/><line x1="762" y1="47" x2="762" y2="58"/></g>
        <path d="M752,47 Q760,38 768,47 Z" fill="#6a5a48"/>
        <rect x="759.3" y="36" width="1.4" height="5" fill="#6a5a48"/>
        <rect x="757" y="76" width="6" height="7" rx="3" fill="#6a5a48" opacity="0.7"/>
      </g>
    </g>

    <!-- title -->
    <text x="400" y="66" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="0.5">awesome-ceuta-y-melilla</text>
    <rect x="330" y="80" width="140" height="2" rx="1" fill="#c7a26c" opacity="0.7"/>
    <text x="400" y="102" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" fill-opacity="0.62" letter-spacing="2.5">SOFTWARE OPEN SOURCE PARA CEUTA Y MELILLA</text>
  </g>
</svg>
