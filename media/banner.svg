<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="r"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/><stop offset="100%" stop-color="#14141f"/>
    </linearGradient>
    <filter id="b1"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <g clip-path="url(#r)">
    <rect width="800" height="200" fill="url(#bg)"/>
    <ellipse cx="150" cy="180" rx="200" ry="120" fill="#000000" opacity="0.15" filter="url(#b1)"/>
    <ellipse cx="650" cy="20" rx="200" ry="120" fill="#FFD700" opacity="0.1" filter="url(#b1)"/>
    <rect width="800" height="2" fill="#000000" opacity="0.6"/>
    <text x="400" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" fill="#fff" font-weight="700" letter-spacing="1">awesome-ceuta-y-melilla</text>
    <rect x="280" y="86" width="240" height="2" rx="1" fill="#000000" opacity="0.5"/>
    <text x="400" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="rgba(255,255,255,0.5)" font-weight="300" letter-spacing="3">SOFTWARE OPEN SOURCE PARA CEUTA Y MELILLA</text>
    <!-- Ceuta: 5-pointed star (left) | Melilla: crescent (right) — multicultural symbols -->
    <g opacity="0.5" transform="translate(400,162)">
      <!-- Ceuta star -->
      <polygon points="-40,-10 -37,-2 -29,-2 -35,3 -33,11 -40,6 -47,11 -45,3 -51,-2 -43,-2" fill="#FFD700"/>
      <!-- Melilla crescent -->
      <circle cx="40" cy="0" r="9" fill="#FFD700"/>
      <circle cx="44" cy="-2" r="7" fill="#0a0a0f"/>
      <!-- Strait of Gibraltar waves between -->
      <path d="M-15,6 Q-10,2 -5,6 Q0,10 5,6 Q10,2 15,6" fill="none" stroke="#0077BE" stroke-width="1.5" opacity="0.4"/>
      <path d="M-18,12 Q-13,8 -8,12 Q-3,16 2,12 Q7,8 12,12 Q17,16 22,12" fill="none" stroke="#0077BE" stroke-width="1" opacity="0.3"/>
    </g>
  </g>
</svg>
